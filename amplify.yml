version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm run build:shared
        - env | grep -e VITE_ >> frontend/.env
    build:
      commands:
        - npm run build:web
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - frontend/node_modules/**/*
      - shared/dist/**/*
